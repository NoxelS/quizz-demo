name: Build and publish image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://quiz:quiz@localhost:5432/quiz
      BASE_URL: http://localhost:3000
      CALENDLY_WEBHOOK_SIGNING_KEY: ci-test-signing-key
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quiz
          POSTGRES_PASSWORD: quiz
          POSTGRES_DB: quiz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quiz -d quiz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/001_create_leads.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/002_calendly_events.sql
      - run: pnpm test
      - name: Run PostgreSQL integration test
        run: |
          pnpm dev > /tmp/quizz-demo.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent "$BASE_URL" >/dev/null; then
              pnpm test:integration
              exit
            fi
            sleep 1
          done
          cat /tmp/quizz-demo.log
          exit 1
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: image
        name: Compute image name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            NEXT_PUBLIC_CALENDLY_URL=https://calendly.com/noel-schwabenland-pm/30min
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
